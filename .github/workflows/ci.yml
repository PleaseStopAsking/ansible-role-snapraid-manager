---
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  ANSIBLE_CORE_VERSION: "2.21.0"
jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ansible-role-snapraid-manager
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install 'ansible-core~=${{ env.ANSIBLE_CORE_VERSION }}' ansible-lint
      - name: Install test collections
        working-directory: ansible-role-snapraid-manager
        run: ansible-galaxy collection install -r tests/requirements.yml -p .ansible/collections
      - name: Lint
        working-directory: ansible-role-snapraid-manager
        run: ansible-lint --offline
      - name: Run host-safe behavior tests
        working-directory: ansible-role-snapraid-manager
        run: ansible-playbook -i localhost, tests/core.yml

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: ansible-role-snapraid-manager
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ansible
        run: pip install 'ansible-core~=${{ env.ANSIBLE_CORE_VERSION }}'
      - name: Install Docker connection plugin
        working-directory: ansible-role-snapraid-manager
        run: ansible-galaxy collection install -r tests/requirements.yml -p .ansible/collections
      - name: Run integration and idempotence tests
        working-directory: ansible-role-snapraid-manager
        run: bash tests/integration.sh '${{ matrix.image }}'

  release:
    name: Create GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.lint-and-unit.result == 'success' &&
      needs.integration.result == 'success'
    needs:
      - lint-and-unit
      - integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example v1.0.0)." >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

      - name: Install Ansible
        run: pip3 install 'ansible-core~=${{ env.ANSIBLE_CORE_VERSION }}'

      - name: Trigger import on Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          : "${GALAXY_API_KEY:?GALAXY_API_KEY secret is required to publish a release}"
          ansible-galaxy role import --api-key "$GALAXY_API_KEY" \
            "${GITHUB_REPOSITORY%%/*}" "${GITHUB_REPOSITORY#*/}"
