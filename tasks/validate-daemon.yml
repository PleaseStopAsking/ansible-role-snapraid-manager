---
- name: Validate daemon platform and options
  ansible.builtin.assert:
    that:
      - ansible_facts['service_mgr'] == 'systemd'
      - snapraid_manager_daemon_options is mapping
      - snapraid_manager_daemon_version is match('^[0-9]+\.[0-9]+(\.[0-9]+)?$')
      - snapraid_manager_allow_daemon_restart is boolean
      - snapraid_manager_daemon_package_checksum is match('^sha256:[a-f0-9]{64}$')
      - snapraid_manager_required_mounts | type_debug == 'list'
      - snapraid_manager_required_mounts | length > 0
      - snapraid_manager_daemon_hook == '' or snapraid_manager_daemon_hook is match('^/[^\r\n]+$')
      - "'hook_script' not in snapraid_manager_daemon_options"
      - "'sys_engine' not in snapraid_manager_daemon_options"
    fail_msg: Use systemd, valid daemon options, and required mounts; configure the engine and custom hook through role variables.

- name: Validate daemon option names and single-line scalar values
  ansible.builtin.assert:
    that:
      - item.key in snapraid_manager_daemon_defaults
      - item.value is string or item.value is number
      - item.value is not boolean
      - "'\n' not in (item.value | string)"
      - "'\r' not in (item.value | string)"
    quiet: true
  loop: "{{ snapraid_manager_daemon_options | dict2items }}"
  no_log: true

- name: Validate maintenance schedule format
  ansible.builtin.assert:
    that:
      - >-
        snapraid_manager_daemon_effective_options.maintenance_schedule is
        match('^(((Mon|Tue|Wed|Thu|Fri|Sat|Sun) )?([01][0-9]|2[0-3]):[0-5][0-9](, *((Mon|Tue|Wed|Thu|Fri|Sat|Sun) )?([01][0-9]|2[0-3]):[0-5][0-9])*)?$')
      - snapraid_manager_daemon_effective_options.sys_log_directory is match('^/[^\r\n]+$')
      - snapraid_manager_daemon_effective_options.scrub_percentage | string is match('^[0-9]+(\.[0-9]+)?$')
      - snapraid_manager_daemon_effective_options.scrub_percentage | float >= 0
      - snapraid_manager_daemon_effective_options.scrub_percentage | float <= 100
      - snapraid_manager_daemon_effective_options.notify_syslog_level in ['info', 'warning', 'error', 'critical']
      - snapraid_manager_daemon_effective_options.notify_result_level in ['info', 'warning', 'error', 'critical']

- name: Validate daemon integer ranges
  ansible.builtin.assert:
    that:
      - snapraid_manager_daemon_effective_options[item.key] | string is match('^[0-9]+$')
      - snapraid_manager_daemon_effective_options[item.key] | int >= item.value[0]
      - snapraid_manager_daemon_effective_options[item.key] | int <= item.value[1]
    quiet: true
  loop: "{{ snapraid_manager_daemon_integer_ranges | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate Healthchecks ownership and execution settings
  ansible.builtin.assert:
    that:
      - "'notify_heartbeat' not in snapraid_manager_daemon_options"
      - "'notify_start' not in snapraid_manager_daemon_options"
      - "'notify_result' not in snapraid_manager_daemon_options"
      - "'notify_result_level' not in snapraid_manager_daemon_options"
      - snapraid_manager_daemon_effective_options.notify_run_as_user in ['', 'root']
      - snapraid_manager_healthchecks_timeout | type_debug == 'int'
      - snapraid_manager_healthchecks_timeout >= 1
      - snapraid_manager_healthchecks_timeout <= 60
      - snapraid_manager_healthchecks_retries | type_debug == 'int'
      - snapraid_manager_healthchecks_retries >= 0
      - snapraid_manager_healthchecks_retries <= 5
    fail_msg: >-
      Healthchecks owns notify_heartbeat, notify_start, notify_result, and
      notify_result_level and requires root notification access, an integer
      timeout of 1-60 seconds, and 0-5 retries.
  when: snapraid_manager_healthchecks_enabled

- name: Validate Healthchecks secret ping URL
  ansible.builtin.assert:
    that:
      - snapraid_manager_healthchecks_ping_url is string
      - snapraid_manager_healthchecks_ping_url | length > 0
      - snapraid_manager_healthchecks_ping_url | urlsplit('scheme') == 'https'
      - snapraid_manager_healthchecks_ping_url | urlsplit('hostname') is not none
      - snapraid_manager_healthchecks_ping_url | urlsplit('username') is none
      - snapraid_manager_healthchecks_ping_url | urlsplit('password') is none
      - snapraid_manager_healthchecks_ping_url | urlsplit('path') | length > 1
      - snapraid_manager_healthchecks_ping_url | urlsplit('query') == ''
      - snapraid_manager_healthchecks_ping_url | urlsplit('fragment') == ''
      - snapraid_manager_healthchecks_ping_url.split() | join('') == snapraid_manager_healthchecks_ping_url
      - snapraid_manager_healthchecks_ping_url | to_json | length == (snapraid_manager_healthchecks_ping_url | length) + 2
  when: snapraid_manager_healthchecks_enabled
  no_log: true

- name: Validate required mount paths
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^/[^\r\n]+$')
  loop: "{{ snapraid_manager_required_mounts }}"
