---
name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
env:
  ANSIBLE_CORE_VERSION: "2.21.0"
jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example v1.0.0)." >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

      - name: Install Ansible
        run: pip3 install 'ansible-core~=${{ env.ANSIBLE_CORE_VERSION }}'

      - name: Trigger import on Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          : "${GALAXY_API_KEY:?GALAXY_API_KEY secret is required to publish a release}"
          ansible-galaxy role import --api-key "$GALAXY_API_KEY" \
            "${GITHUB_REPOSITORY%%/*}" "${GITHUB_REPOSITORY#*/}"
