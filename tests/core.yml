---
- name: Test core validation and rendering without modifying the host
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_facts:
      distribution: Debian
      architecture: x86_64
      service_mgr: systemd
    ansible_managed: Ansible managed
    snapraid_manager_data_disks:
      - name: d1
        path: /mnt/data1
      - name: d2
        path: /mnt/data2
    snapraid_manager_parity_disks:
      - level: 1
        path: /mnt/parity1/snapraid.parity
      - level: 2
        path: /mnt/parity2/snapraid.parity
    snapraid_manager_content_files:
      - /var/snapraid.content
      - /mnt/data1/.snapraid.content
      - /mnt/data2/.snapraid.content
    snapraid_manager_excludes:
      - "*.unrecoverable"
      - /lost+found/
  tasks:
    - name: Run core validation
      ansible.builtin.include_role:
        name: ansible-role-snapraid-manager
        tasks_from: validate
        public: true

    - name: Verify explicit array identities and content paths
      ansible.builtin.assert:
        that:
          - "'data d1 /mnt/data1' in rendered"
          - "'data d2 /mnt/data2' in rendered"
          - "'parity /mnt/parity1/snapraid.parity' in rendered"
          - "'2-parity /mnt/parity2/snapraid.parity' in rendered"
          - "'content /mnt/data1/.snapraid.content' in rendered"
          - "'content /mnt/data2/.snapraid.content' in rendered"
          - "'exclude *.unrecoverable' in rendered"
      vars:
        rendered: "{{ lookup('ansible.builtin.template', '../templates/snapraid.conf.j2') }}"

    - name: Verify reordering data disks preserves identities
      ansible.builtin.assert:
        that:
          - "'data d1 /mnt/data1' in rendered"
          - "'data d2 /mnt/data2' in rendered"
      vars:
        snapraid_manager_data_disks:
          - name: d2
            path: /mnt/data2
          - name: d1
            path: /mnt/data1
        rendered: "{{ lookup('ansible.builtin.template', '../templates/snapraid.conf.j2') }}"

    - name: Verify daemon is opt-in
      ansible.builtin.assert:
        that:
          - not snapraid_manager_daemon_enabled
          - not snapraid_manager_healthchecks_enabled

    - name: Verify upstream CLI version formats
      ansible.builtin.assert:
        that:
          - item is search('(?i)^snapraid( cli)? v[0-9]+\.[0-9]+')
          - (item | regex_search('[0-9]+\.[0-9]+')) is version('15.1', '>=')
      loop:
        - 'SnapRAID CLI v15.1 by Andrea Mazzoleni, https://www.snapraid.it'
        - 'snapraid v15.1 by Andrea Mazzoleni'

    - name: Validate daemon defaults
      ansible.builtin.include_role:
        name: ansible-role-snapraid-manager
        tasks_from: validate-daemon
        public: true

    - name: Validate enabled Healthchecks configuration
      ansible.builtin.include_role:
        name: ansible-role-snapraid-manager
        tasks_from: validate-daemon
      vars:
        snapraid_manager_healthchecks_enabled: true
        snapraid_manager_healthchecks_ping_url: https://hc-ping.com/test-check-identifier

    - name: Verify daemon scheduling and network are safe by default
      ansible.builtin.assert:
        that:
          - "'maintenance_schedule = \n' in rendered"
          - "'net_port = 127.0.0.1:7627' in rendered"
          - "'spindown_idle_minutes = 0' in rendered"
          - "'sys_engine = /usr/bin/snapraid' in rendered"
          - "'hook_script = /usr/local/libexec/snapraid-manager-mount-check' in rendered"
      vars:
        rendered: "{{ lookup('ansible.builtin.template', '../templates/snapraidd.conf.j2') }}"

    - name: Verify Healthchecks heartbeat keeps the secret out of daemon commands
      ansible.builtin.assert:
        that:
          - "'notify_heartbeat = /usr/bin/curl --disable --config /etc/snapraid-manager/healthchecks.curl' in daemon_config"
          - "'notify_start = /usr/local/libexec/snapraid-manager-healthchecks start %h' in daemon_config"
          - "'notify_result = /usr/local/libexec/snapraid-manager-healthchecks result %h %l' in daemon_config"
          - "'notify_result_level = error' in daemon_config"
          - snapraid_manager_healthchecks_ping_url not in daemon_config
          - "'url = \"https://hc-ping.com/test-check-identifier\"' in curl_config"
          - "'url = \"https://hc-ping.com/test-check-identifier/start\"' in start_curl_config"
          - "'url = \"https://hc-ping.com/test-check-identifier/fail\"' in fail_curl_config"
          - "'/etc/snapraid-manager/healthchecks-start.curl' in notify_script"
          - "'/etc/snapraid-manager/healthchecks-fail.curl' in notify_script"
          - "'start:maintenance)' in notify_script"
          - "'result:maintenance)' in notify_script"
          - "'error|critical)' in notify_script"
          - "'max-time = 10' in curl_config"
          - "'retry = 3' in curl_config"
      vars:
        snapraid_manager_healthchecks_enabled: true
        snapraid_manager_healthchecks_ping_url: https://hc-ping.com/test-check-identifier
        daemon_config: "{{ lookup('ansible.builtin.template', '../templates/snapraidd.conf.j2') }}"
        curl_config: "{{ lookup('ansible.builtin.template', '../templates/healthchecks.curl.j2') }}"
        start_curl_config: "{{ lookup('ansible.builtin.template', '../templates/healthchecks-start.curl.j2') }}"
        notify_script: "{{ lookup('ansible.builtin.template', '../templates/healthchecks-notify.sh.j2') }}"
        fail_curl_config: "{{ lookup('ansible.builtin.template', '../templates/healthchecks-fail.curl.j2') }}"

    - name: Verify opt-in reports enable informational results without changing the heartbeat
      ansible.builtin.assert:
        that:
          - "'notify_result_level = info' in daemon_config"
          - "'notify_heartbeat = /usr/bin/curl --disable --config /etc/snapraid-manager/healthchecks.curl' in daemon_config"
          - snapraid_manager_healthchecks_ping_url not in daemon_config
          - "'url = \"https://hc-ping.com/test-check-identifier/log\"' in log_config"
      vars:
        snapraid_manager_healthchecks_enabled: true
        snapraid_manager_healthchecks_include_report: true
        snapraid_manager_healthchecks_ping_url: https://hc-ping.com/test-check-identifier
        daemon_config: "{{ lookup('ansible.builtin.template', '../templates/snapraidd.conf.j2') }}"
        log_config: "{{ lookup('ansible.builtin.template', '../templates/healthchecks-log.curl.j2') }}"

    - name: Test Healthchecks notifier without network requests
      block:
        - name: Create temporary notifier test directory
          ansible.builtin.tempfile:
            state: directory
          register: snapraid_manager_test_notify_dir

        - name: Install fake curl to capture arguments and request body
          ansible.builtin.copy:
            dest: "{{ snapraid_manager_test_notify_dir.path }}/curl"
            mode: '0700'
            content: |
              #!/bin/sh
              printf '%s\n' "$@"
              case "$*" in
                  *--data-binary*) cat ;;
              esac

        - name: Render both notifier modes with fake curl
          ansible.builtin.copy:
            dest: "{{ snapraid_manager_test_notify_dir.path }}/notify-{{ item }}"
            mode: '0700'
            content: >-
              {{ lookup('ansible.builtin.template', '../templates/healthchecks-notify.sh.j2')
                 | replace('/usr/bin/curl', snapraid_manager_test_notify_dir.path ~ '/curl') }}
          vars:
            snapraid_manager_healthchecks_include_report: "{{ item }}"
          loop: [false, true]

        - name: Exercise notifier routing and body handling
          ansible.builtin.command:
            argv:
              - /bin/sh
              - "{{ snapraid_manager_test_notify_dir.path }}/notify-{{ item.reports }}"
              - "{{ item.event | default('result') }}"
              - "{{ item.task | default('maintenance') }}"
              - "{{ item.level }}"
            stdin: "Maintenance report: paths with spaces and $literal shell text"
          changed_when: false
          register: snapraid_manager_test_notify_result
          failed_when: >-
            snapraid_manager_test_notify_result.rc != 0 or
            (item.endpoint | default('')) not in snapraid_manager_test_notify_result.stdout or
            (item.endpoint is not defined and snapraid_manager_test_notify_result.stdout != '') or
            (('Maintenance report: paths with spaces and $literal shell text' in snapraid_manager_test_notify_result.stdout)
             != (item.body | default(false)))
          loop:
            - {reports: false, level: info}
            - {reports: false, level: warning}
            - {reports: false, level: error, endpoint: healthchecks-fail.curl}
            - {reports: false, level: critical, endpoint: healthchecks-fail.curl}
            - {reports: true, level: info, endpoint: healthchecks-log.curl, body: true}
            - {reports: true, level: warning, endpoint: healthchecks-log.curl, body: true}
            - {reports: true, level: error, endpoint: healthchecks-fail.curl, body: true}
            - {reports: true, level: critical, endpoint: healthchecks-fail.curl, body: true}
            - {reports: true, event: start, level: info, endpoint: healthchecks-start.curl}
            - {reports: true, task: heal, level: error}
            - {reports: true, task: refresh, level: info}
            - {reports: true, task: undelete, level: warning}
      always:
        - name: Remove temporary notifier test files
          ansible.builtin.file:
            path: "{{ snapraid_manager_test_notify_dir.path }}"
            state: absent
          when: snapraid_manager_test_notify_dir.path is defined

    - name: Verify user options merge with security defaults
      ansible.builtin.assert:
        that:
          - "'maintenance_schedule = Mon 03:00, Thu 04:00' in rendered"
          - "'net_port = 127.0.0.1:7627' in rendered"
          - "'net_config_full_access = 0' in rendered"
      vars:
        snapraid_manager_daemon_options:
          maintenance_schedule: Mon 03:00, Thu 04:00
        rendered: "{{ lookup('ansible.builtin.template', '../templates/snapraidd.conf.j2') }}"

    - name: Verify service uses explicit CLI configuration
      ansible.builtin.assert:
        that:
          - "'-C \"/etc/snapraid.conf\"' in rendered"
          - "'RequiresMountsFor=' in rendered"
      vars:
        rendered: "{{ lookup('ansible.builtin.template', '../templates/daemon-override.conf.j2') }}"

    - name: Verify invalid configurations are rejected
      ansible.builtin.include_tasks: reject.yml
      loop:
        - name: No data disks
          data: []
          expected: Validate array collections
        - name: Duplicate disk names
          data:
            - { name: d1, path: /mnt/data1 }
            - { name: d1, path: /mnt/data2 }
          expected: Validate stable and unique array identities
        - name: Repeated parity level
          parity:
            - { level: 1, path: /mnt/parity1/snapraid.parity }
            - { level: 1, path: /mnt/parity2/snapraid.parity }
          expected: Validate stable and unique array identities
        - name: Configuration directive injection
          excludes: ["*.tmp\ndata injected /tmp"]
          expected: Validate exclusion patterns
        - name: Unsupported platform
          distribution: Fedora
          expected: Validate supported host
        - name: Healthchecks requires daemon integration
          healthchecks_enabled: true
          expected: Validate role switches and configuration paths
        - name: Healthchecks report switch must be boolean
          include_report: "yes"
          expected: Validate role switches and configuration paths
        - name: Healthchecks rejects an empty ping URL
          tasks_from: validate-daemon
          healthchecks_enabled: true
          ping_url: ''
          expected: Validate Healthchecks secret ping URL
        - name: Healthchecks requires HTTPS
          tasks_from: validate-daemon
          healthchecks_enabled: true
          ping_url: http://hc-ping.com/test-check-identifier
          expected: Validate Healthchecks secret ping URL
        - name: Healthchecks rejects configuration injection
          tasks_from: validate-daemon
          healthchecks_enabled: true
          ping_url: "https://hc-ping.com/test\nverbose"
          expected: Validate Healthchecks secret ping URL
        - name: Healthchecks rejects conflicting heartbeat commands
          tasks_from: validate-daemon
          healthchecks_enabled: true
          daemon_options:
            notify_heartbeat: /usr/bin/true
          expected: Validate Healthchecks ownership and execution settings
        - name: Healthchecks rejects conflicting result commands
          tasks_from: validate-daemon
          healthchecks_enabled: true
          daemon_options:
            notify_result: /usr/bin/true
          expected: Validate Healthchecks ownership and execution settings
        - name: Healthchecks rejects conflicting result level
          tasks_from: validate-daemon
          healthchecks_enabled: true
          daemon_options:
            notify_result_level: info
          expected: Validate Healthchecks ownership and execution settings
        - name: Healthchecks rejects an unprivileged notification user
          tasks_from: validate-daemon
          healthchecks_enabled: true
          daemon_options:
            notify_run_as_user: nobody
          expected: Validate Healthchecks ownership and execution settings
        - name: Healthchecks requires a bounded timeout
          tasks_from: validate-daemon
          healthchecks_enabled: true
          timeout: 0
          expected: Validate Healthchecks ownership and execution settings
      loop_control:
        loop_var: snapraid_manager_test_case
        label: "{{ snapraid_manager_test_case.name }}"
